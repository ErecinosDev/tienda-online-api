spring.application.name=tienda-online-api

# La aplicación valida el mapeo JPA, pero nunca crea ni modifica el esquema existente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# No ejecutar scripts SQL automáticamente.
spring.sql.init.mode=never

# Escenarios reproducibles de pago simulado: APROBADO, RECHAZADO o ERROR_TECNICO.
pagos.tarjeta.escenario=APROBADO
pagos.paypal.escenario=APROBADO
